name: Build R8 skill candidate

on:
  push:
    branches:
      - r8-skill-hardening
    paths:
      - '.github/workflows/r8-build.yml'
      - 'ddkg-agent-skill/apply_r8_hardening.py'
      - 'ddkg-agent-skill/apply_r8_followup.py'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify known baseline artifact
        shell: bash
        run: |
          set -euo pipefail
          cd ddkg-agent-skill
          observed="$(sha256sum ddkg.skill | awk '{print $1}')"
          echo "Current archive sha256: ${observed}"
          case "${observed}" in
            eca6c7f7461bab113160fe8a4c71260c35fc4350a0b632294d56ef770cbfdb60) ;;
            f33334b293a4572b64198e1a7c039c61702bf6182b19ce7f5648d86102530546) ;;
            *) echo "Unexpected baseline archive" >&2; exit 1 ;;
          esac

      - name: Apply reviewed R8 hardening
        shell: bash
        run: |
          set -euo pipefail
          # The R7 source wraps this sentence across two lines; normalize the
          # one-time implementation helper before executing it.
          python - <<'PY'
          from pathlib import Path
          p = Path('ddkg-agent-skill/apply_r8_hardening.py')
          text = p.read_text(encoding='utf-8')
          old = '"""- **Threshold numbers on the Code node**, not the edge. Values live on bin Codes (`EXPBINS`, `PVALUEBINS`).\\n"""'
          new = '"""- **Threshold numbers on the Code node**, not the edge. Values live on bin\\n  Codes (`EXPBINS`, `PVALUEBINS`).\\n"""'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          python ddkg-agent-skill/apply_r8_hardening.py
          python ddkg-agent-skill/apply_r8_followup.py

      - name: Validate routing
        shell: bash
        run: |
          set -euo pipefail
          python ddkg-agent-skill/source/ddkg/scripts/route.py --check | tee /tmp/r8-route-check.txt

      - name: Run generic public hygiene check on source
        run: python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/source/ddkg

      - name: Build deterministic skill archive
        shell: bash
        run: |
          set -euo pipefail
          python ddkg-agent-skill/build_skill.py | tee /tmp/r8-build.txt

      - name: Run generic public hygiene check on archive
        run: python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/ddkg.skill

      - name: Write R8 build record and refresh README identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('ddkg-agent-skill')
          archive = root / 'ddkg.skill'
          source = root / 'source' / 'ddkg'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          size = archive.stat().st_size
          files = sum(1 for p in source.rglob('*') if p.is_file())
          route_text = Path('/tmp/r8-route-check.txt').read_text(encoding='utf-8')
          match = re.search(r'Graph validation passed: (\d+) edges', route_text)
          if not match:
              raise SystemExit('Could not recover routing count from route.py --check')
          routes = int(match.group(1))

          record = f'''# R8 build record

          - DDKG target: `DataDistillery_2025_04_DEC`
          - Base commit: R7 merge `57352d09e692c52e1b56afacfdf05851ae6282af`
          - Bundled files: {files}
          - Routing relationships: {routes}
          - Archive size: {size} bytes
          - SHA-256: `{digest}`

          ## R8 changes

          R8 hardens the December 2025 release skill around silent-failure modes identified during R5b/R7 development testing:

          - failed diagnostics are gates that stop dependent query composition;
          - cross-source set operations require both sources at the same biological identifier level;
          - absence of a direct link is not treated as absence of every possible graph route;
          - display labels use a verified source-specific preferred-term edge or fall back to CodeID;
          - GTEx thresholds select enumerated EXPBINS/PVALUEBINS identifiers rather than assumed numeric properties;
          - Browser display limits are treated as client/configuration dependent rather than a universal row number;
          - ingest submission syntax, Concept.CUI values, and stored CodeID values are explicitly separated;
          - synonym scans are candidate discovery only;
          - compound/drug resolution routes to the general one-Code/several-Concepts rule, not only minted-twin handling;
          - MED-RT contraindication endpoints are not assumed to be disease-only;
          - the public hygiene procedure requires a deployment-specific denylist before the artifact is formally frozen for evaluation.

          ## Release status

          This branch artifact is the **R8 release candidate**. Generic public-hygiene checks passed on both the source tree and built archive. Before the evaluation artifact is declared frozen, the release owner must rerun `check_public_skill_hygiene.py` on both source and archive with `--require-denylist` and an external deployment-specific denylist that is not committed to the repository.
          '''
          record = '\n'.join(line[10:] if line.startswith('          ') else line for line in record.splitlines()) + '\n'
          (root / 'R8_BUILD.md').write_text(record, encoding='utf-8')

          readme = (root / 'README.md').read_text(encoding='utf-8')
          replacement = (
              f'**Current R8 release candidate:** {size:,} bytes  \n'
              f'**SHA-256:** `{digest}`\n\n'
              'See [`R8_BUILD.md`](R8_BUILD.md) for the build record and freeze requirement.'
          )
          readme = re.sub(
              r'\*\*Current R(?:7 archive|8 release candidate):\*\*[^\n]*\n'
              r'\*\*SHA-256:\*\* `[^`]+`\n\n'
              r'See \[`R[78]_BUILD\.md`\]\(R[78]_BUILD\.md\)[^\n]*',
              replacement,
              readme,
              count=1,
          )
          readme = re.sub(
              r'The R[78] (?:archive|release candidate) contains \*\*\d+ bundled files\*\* and \*\*\d+ routing relationships\*\* checked by `route\.py --check`\.',
              f'The R8 release candidate contains **{files} bundled files** and **{routes} routing relationships** checked by `route.py --check`.',
              readme,
              count=1,
          )
          (root / 'README.md').write_text(readme, encoding='utf-8')

          print(f'R8 candidate: {size} bytes; {files} files; {routes} routes; sha256 {digest}')
          PY

      - name: Commit R8 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ddkg-agent-skill/source/ddkg \
                  ddkg-agent-skill/ddkg.skill \
                  ddkg-agent-skill/README.md \
                  ddkg-agent-skill/R8_BUILD.md
          git commit -m "Rebuild R8 skill hardening candidate"
          git push origin HEAD:r8-skill-hardening
