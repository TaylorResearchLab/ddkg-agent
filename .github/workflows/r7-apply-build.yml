# R7 rebuild trigger 5
name: R7 apply and build

on:
  push:
    branches:
      - fix/r7-portable-index-aware-skill
    paths:
      - .github/workflows/r7-apply-build.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r7-portable-index-aware-skill

      - name: Apply R7 source repairs
        run: |
          python ddkg-agent-skill/tools/apply_r7.py
          sed -i 's/03_schema_this_build.md#query-cost-on-an-unindexed-build/03_schema_this_build.md#query-cost/g' ddkg-agent-skill/source/ddkg/assets/skill_graph.tsv

      - name: Validate source and build archive
        run: |
          python ddkg-agent-skill/source/ddkg/scripts/route.py --check
          python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/source/ddkg
          python ddkg-agent-skill/build_skill.py
          python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/ddkg.skill

      - name: Write build record
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          skill = Path('ddkg-agent-skill/ddkg.skill')
          digest = hashlib.sha256(skill.read_bytes()).hexdigest()
          graph = Path('ddkg-agent-skill/source/ddkg/assets/skill_graph.tsv').read_text(encoding='utf-8')
          edges = sum(1 for line in graph.splitlines() if line.strip() and not line.lstrip().startswith('#'))
          files = sum(1 for p in Path('ddkg-agent-skill/source/ddkg').rglob('*') if p.is_file())

          record = (
              '# R7 build record\n\n'
              '- DDKG target: `DataDistillery_2025_04_DEC`\n'
              f'- Bundled files: {files}\n'
              f'- Routing relationships: {edges}\n'
              f'- Archive size: {skill.stat().st_size} bytes\n'
              f'- SHA-256: `{digest}`\n\n'
              '## R7 changes\n\n'
              '- Removed the private-deployment index assumption from the shipped schema reference.\n'
              '- Made index and query-cost guidance deployment-neutral and based on `SHOW INDEXES`.\n'
              '- Documented the index consequence of function-wrapped `Term.name` predicates.\n'
              '- Reworked entity-resolution and hand-over recipes to reduce candidates before tolerant name matching.\n'
              '- Added deterministic source-to-archive rebuilding and a public-release hygiene check.\n\n'
              'The DDKG schema target is unchanged. R7 is a skill repair for the December 2025 release.\n'
          )
          Path('ddkg-agent-skill/R7_BUILD.md').write_text(record, encoding='utf-8')

          readme = Path('ddkg-agent-skill/README.md')
          text = readme.read_text(encoding='utf-8')
          build_line = f'Current R7 archive: **{skill.stat().st_size} bytes**, SHA-256 `{digest}`.\n\n'
          anchor = '## What the skill does\n'
          if 'Current R7 archive:' in text:
              text = re.sub(r'Current R7 archive:.*?\n\n', build_line, text, count=1, flags=re.S)
          else:
              text = text.replace(anchor, build_line + anchor)
          readme.write_text(text, encoding='utf-8')
          print(record)
          PY

      - name: Remove temporary repair machinery and commit R7
        run: |
          rm -f .github/workflows/r7-unpack-skill.yml
          rm -f .github/workflows/r7-apply-build.yml
          rm -f ddkg-agent-skill/tools/apply_r7.py
          rmdir ddkg-agent-skill/tools 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair DDKG skill portability and index-aware resolution"
          git push origin HEAD:fix/r7-portable-index-aware-skill
