# rerun after hygiene checker refinement
name: R7 review check

on:
  push:
    branches:
      - fix/r7-portable-index-aware-skill
    paths:
      - .github/workflows/r7-review-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r7-portable-index-aware-skill
          fetch-depth: 0
      - name: Validate R7 source and archive
        run: |
          python ddkg-agent-skill/source/ddkg/scripts/route.py --check
          python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/source/ddkg
          python ddkg-agent-skill/check_public_skill_hygiene.py ddkg-agent-skill/ddkg.skill
      - name: Verify routing entry points unchanged from R6 main
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from io import BytesIO
          from zipfile import ZipFile

          current = Path('ddkg-agent-skill/source/ddkg/assets/skill_graph.tsv').read_text(encoding='utf-8')
          old_skill = subprocess.check_output([
              'git','show','origin/main:ddkg-agent-skill/ddkg.skill'
          ])
          with ZipFile(BytesIO(old_skill)) as zf:
              old = zf.read('ddkg/assets/skill_graph.tsv').decode('utf-8')

          suffixes = ('.md','.tsv','.csv','.json','.py','.txt','.yaml','.yml')
          def entry_points(text):
              out=set()
              for raw in text.splitlines():
                  if not raw.strip() or raw.lstrip().startswith('#'):
                      continue
                  parts=raw.split('\t')
                  if len(parts) < 3:
                      continue
                  subj=parts[0].strip().lower()
                  if ('#' not in subj and '/' not in subj and not subj.endswith(suffixes)):
                      out.add(subj)
              return out

          a=entry_points(old)
          b=entry_points(current)
          print(f'R6 entry points: {len(a)}')
          print(f'R7 entry points: {len(b)}')
          print('Added:', sorted(b-a))
          print('Removed:', sorted(a-b))
          if a != b:
              raise SystemExit('routing entry-point set changed')
          PY
