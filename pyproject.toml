[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddkg-agent"
version = "0.0.1"
description = "Typed, validated natural-language query planning for the DDKG"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
